name: Sync VXMENC3

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync.yml'
      - 'scripts/update.py'
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: vxm-playlist-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests cryptography

      - name: Run VXMENC3 sync
        run: python scripts/update.py
        env:
          UPSTREAM_PLAYLIST_URL: ${{ secrets.UPSTREAM_PLAYLIST_URL }}
          VXMENC3_PRIVATE_KEY_B64: ${{ secrets.VXMENC3_PRIVATE_KEY_B64 }}

      - name: Validate VXMENC3
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("vxm.enc")

          if not p.exists():
              raise SystemExit("ERROR: vxm.enc không tồn tại")

          data = p.read_bytes()

          if len(data) < 96:
              raise SystemExit("ERROR: vxm.enc quá nhỏ")

          if data[:8] != b"VXMENC3\x00":
              raise SystemExit("ERROR: vxm.enc không phải VXMENC3")

          print(f"VXMENC3 OK - {len(data):,} bytes")
          PY

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add vxm.enc

          if git diff --cached --quiet; then
            echo "Không có thay đổi, bỏ qua commit."
          else
            git commit -m "chore: sync VXMENC3 playlist [skip ci]"
            git push
          fi
