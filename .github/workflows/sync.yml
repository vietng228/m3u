name: Sync

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync.yml'
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Restore repository logos
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path('m3u.m3u')
          lines = path.read_text(encoding='utf-8').splitlines()
          output = []
          restored = 0

          for line in lines:
              if not line.startswith('#EXTINF'):
                  output.append(line)
                  continue

              match = re.search(r'tvg-id\s*=\s*"([^"]+)"', line, re.I)
              if not match:
                  output.append(line)
                  continue

              tvg_id = match.group(1).strip()
              logo = f'https://raw.githubusercontent.com/vietng228/m3u/main/logos/{tvg_id}.png'

              if re.search(r'tvg-logo\s*=\s*"[^"]*"', line, re.I):
                  new_line = re.sub(
                      r'tvg-logo\s*=\s*"[^"]*"',
                      f'tvg-logo="{logo}"',
                      line,
                      count=1,
                      flags=re.I,
                  )
              elif ',' in line:
                  head, name = line.rsplit(',', 1)
                  new_line = f'{head} tvg-logo="{logo}",{name}'
              else:
                  new_line = line

              if new_line != line:
                  restored += 1
              output.append(new_line)

          path.write_text('\n'.join(output) + '\n', encoding='utf-8', newline='\n')
          print(f'Restored repository logos: {restored}')
          PY

      - name: Run sync script
        run: python scripts/update.py
        env:
          UPSTREAM_PLAYLIST_URL: ${{ secrets.UPSTREAM_PLAYLIST_URL }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add m3u.m3u

          if git diff --cached --quiet; then
            echo "Không có thay đổi, bỏ qua commit."
          else
            git commit -m "chore: auto sync channels [skip ci]"
            git push
          fi
