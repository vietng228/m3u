name: SPORT STREAM Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: sport-stream-sync
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright
          python -m playwright install --with-deps chromium

      - name: Build sport.m3u
        timeout-minutes: 18
        run: python scripts/update_sport.py

      - name: Show result
        run: |
          echo '===== sport.m3u ====='
          cat sport.m3u

      - name: Commit playlist when changed
        run: |
          if git diff --quiet -- sport.m3u && ! git ls-files --error-unmatch sport.m3u >/dev/null 2>&1; then
            echo 'No playlist file to commit'
            exit 0
          fi
          if git diff --quiet -- sport.m3u; then
            echo 'No changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sport.m3u
          git commit -m 'Update sport playlist'
          git push
