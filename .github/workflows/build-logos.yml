name: Build logos

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pillow
      - name: Generate uniform channel logos
        run: python scripts/build_logos.py
      - name: Commit generated logos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logos
          if git diff --cached --quiet; then
            echo "No logo changes."
          else
            git commit -m "chore: build uniform channel logos [skip ci]"
            git push
          fi
